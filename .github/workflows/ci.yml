name: Platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-only-not-a-secret
      RUNTIME_DB_PASSWORD: ci-runtime-not-a-secret
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Backend integration tests
        run: docker compose --profile test run --build --rm backend-test
      - name: Backend lint and format
        run: |
          docker compose run --rm --no-deps backend-test ruff check --no-cache .
          docker compose run --rm --no-deps backend-test ruff format --check --no-cache .
      - name: Build and start application
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Install browser testing dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Browser smoke tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Identity browser integration in isolated environment
        run: sh scripts/check-identity.sh
      - name: Verify database survives restart
        run: sh scripts/check-persistence.sh
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop isolated CI environment
        if: always()
        run: docker compose --profile test down
